[package]
name = "kvasir-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["soulwax <soulwax-95@protonmail.com>"]
description = "Command-line client for the kvasir music library."
readme = "README.md"
repository = "https://github.com/soulwax/kvasir-cli"
homepage = "https://github.com/soulwax/kvasir-cli"
keywords = ["music", "deezer", "cli", "audio", "metadata"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[[bin]]
name = "kvasir-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
kvasir-core = "0.1.0"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
