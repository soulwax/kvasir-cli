[package]
name = "kvasir-cli"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-only"
authors = ["soulwax <soulwax-95@protonmail.com>"]
description = "Command-line client for the kvasir music library."
readme = "README.md"
repository = "https://github.com/soulwax/kvasir-cli"
homepage = "https://github.com/soulwax/kvasir-cli"
keywords = ["music", "deezer", "cli", "audio", "metadata"]
categories = ["command-line-utilities"]
rust-version = "1.85"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.release.build-override]
opt-level = 0
codegen-units = 16

[[bin]]
name = "kvasir"
path = "src/main.rs"

[[bin]]
name = "kvasir-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"
kvasir-core = "0.1.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tao = "0.37.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wry = "0.57.0"
