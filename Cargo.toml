[package]
name = "kvasir-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["soulwax <soulwax-95@protonmail.com>"]
description = "Command-line proof of the kvasir library."
publish = false
rust-version = "1.85"

[[bin]]
name = "kvasir-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
kvasir-core = { path = "../kvasir/crates/kvasir-core" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
